name: Build NuGet packages

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        
    - name: Install .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 9.x

    - name: Restore solution
      run: dotnet restore
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Build solution
      run: dotnet build -c $Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Run language tests (code optimizations disabled)
      working-directory: Assessment/Tests/EVIL.Assessment.Tests.VM.Language/bin/${{ matrix.configuration }}/net9.0
      run: dotnet EVIL.Assessment.Tests.VM.Language.dll tests --fail-on-compiler-errors --fail-on-test-errors
      
    - name: Run language tests (code optimizations enabled)
      working-directory: Assessment/Tests/EVIL.Assessment.Tests.VM.Language/bin/${{ matrix.configuration }}/net9.0
      run: dotnet EVIL.Assessment.Tests.VM.Language.dll tests --fail-on-compiler-errors --fail-on-test-errors -o
    
    - name: Create NuGet packages
      run: |
        dotnet pack -c $Configuration
        mkdir evil-nuget-latest
        mv Deployment/EVIL.Deployment.Core/bin/${{ matrix.configuration }}/*.nupkg evil-nuget-latest/
        mv Deployment/EVIL.Deployment.VM/bin/${{ matrix.configuration }}/*.nupkg evil-nuget-latest/
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Upload built artifact
      uses: actions/upload-artifact@v4.6.1
      with:
        name: evil-nuget_${{ matrix.configuration }}-latest
        path: evil-nuget-latest
        if-no-files-found: error
        retention-days: 90
