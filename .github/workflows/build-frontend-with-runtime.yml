name: Build EVIL front-end with runtime

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        runtime-identifier: [win-x64, linux-x64]
        configuration: [Debug, Release]

    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        
    - name: Install .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 9.x

    - name: Restore solution
      run: dotnet restore
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Build solution
      run: dotnet build -c $Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Run language tests (code optimizations disabled)
      working-directory: Assessment/Tests/EVIL.Assessment.Tests.VM.Language/bin/${{ matrix.configuration }}/net9.0
      run: dotnet EVIL.Assessment.Tests.VM.Language.dll tests --fail-on-compiler-errors --fail-on-test-errors

    - name: Run language tests (code optimizations enabled)
      working-directory: Assessment/Tests/EVIL.Assessment.Tests.VM.Language/bin/${{ matrix.configuration }}/net9.0
      run: dotnet EVIL.Assessment.Tests.VM.Language.dll tests --fail-on-compiler-errors --fail-on-test-errors -o

    - name: Publish to directory
      run: dotnet publish EVIL/FE/EVIL.FE/EVIL.FE.csproj -c $Configuration -r $RuntimeIdentifier --no-self-contained -p:PublishSingleFile=true
      env:
        Configuration: ${{ matrix.configuration }}
        RuntimeIdentifier: ${{ matrix.runtime-identifier }}
        
    - name: Fetch front-end version
      id: package_version
      uses: MWin10/get-csproj-version-fork@v1.5.0
      with:
        file: EVIL/FE/EVIL.FE/EVIL.FE.csproj

    - name: Pack artifact
      uses: actions/upload-artifact@v4.6.1
      with:
        name: evil-${{ steps.package_version.outputs.version }}_${{ matrix.runtime-identifier }}-${{ matrix.configuration }}
        path: EVIL/FE/EVIL.FE/bin/${{ matrix.configuration }}/net9.0/${{ matrix.runtime-identifier }}/publish
        if-no-files-found: error
        retention-days: 90
